<article class="card"><img src="pad thai.jpg" alt="ผัดไทย"><section><h2>ผัดไทย</h2><p>เส้นผัดกับไข่ เต้าหู้ ถั่วงอก และถั่วลิสง เป็นเมนูไทยที่รู้จักกันทั่วโลก</p></section></article>
<article class="card"><img src="tom-yum-kung.jpg" alt="ต้มยำกุ้ง"><section><h2>ต้มยำกุ้ง</h2><p>ต้มยำรสเปรี้ยวเผ็ดหอมสมุนไพรและกุ้ง เป็นเมนูที่เหมาะกับคนชอบรสจัด</p></section></article>

<article class="card"><img src="Som tum.jpg" alt="ส้มตำ"><section><h2>ส้มตำ</h2><p>ส้มตำมะละกอรสเปรี้ยวเผ็ด สดกรอบ และปรับระดับความเผ็ดได้ตามชอบ</p></section></article>
